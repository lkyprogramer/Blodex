styleTag: grim-fantasy-audio-v1
defaults:
  format: ogg
phase7_content_gate:
  naming_policy:
    id_pattern: "<scope>_<subject>_<action>_01"
    event_key_pattern: "<domain>:<subject>:<action>"
    output_name_pattern: "<id>.ogg"
  minimum_ship_set:
    "7.4":
      description: Boss 管线与遭遇编排最小 cue 集
      cues:
        - id: ui_boss_node_open_01
          category: ui
          event_key: boss:pipeline:nodeOpen
          implementation_status: plan_frozen
          runtime_binding:
            binding_mode: placeholder_binding
            placeholder_audio_manifest_entry_id: ui_event_wandering_merchant_open_01
            placeholder_surface: boss-node-open-placeholder
        - id: sfx_boss_telegraph_warning_01
